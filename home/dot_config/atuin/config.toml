# Only the settings that differ from Atuin's defaults; see the upstream
# config.toml for the full list of keys.

auto_sync = true
update_check = true
sync_frequency = "10m"
filter_mode = "session-preload"
workspaces = true
show_preview = true
ctrl_n_shortcuts = true
enter_accept = true
keymap_mode = "vim-insert"
network_connect_timeout = 10
network_timeout = 60

[stats]
common_subcommands = [
    "apt",
    "git",
    "docker",
    "go",
    "corepack",
    "tmux",
    "systemctl",
]

[sync]
records = true

[tmux]
# Requires tmux >= 3.2; used for the interactive search popup.
enabled = true
